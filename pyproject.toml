[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-modernization-factory"
version = "0.1.0"
description = "Enterprise SAS-to-Databricks modernization factory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography>=45,<51",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=13.9,<15",
  "typing-extensions>=4.12,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pre-commit>=4,<5",
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "types-PyYAML>=6.0.12,<7",
  "types-jsonschema>=4.25,<5"
]

conversion = [
  "sas2databricks==0.4.0",
  # CV-04 executes only an exact, privately staged deterministic import closure.
  "sqlglot==30.17.0",
  "PyYAML==6.0.3",
  # BASE-08 intentionally wraps the qualified upstream parser; SMF does not implement one.
  "pyreadstat==1.3.6",
  "narwhals==2.26.0",
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.3; python_version >= '3.12'"
]

vertical-slice = [
  "sas-modernization-factory[conversion]",
  "pyspark==3.5.8",
  "py4j==0.10.9.7",
  "deltalake==1.6.4",
  "pyarrow==25.0.1",
  "datacompy==1.0.4",
  "pandas==2.2.3",
  "polars==1.43.2",
  "polars-runtime-32==1.43.2"
]

azure = [
  "azure-identity>=1.24,<2",
  "azure-keyvault-secrets>=4.10,<5",
  "azure-servicebus>=7.14,<8",
  "azure-storage-blob>=12.26,<13",
  "azure-monitor-opentelemetry>=1.7,<2"
]

databricks = [
  "databricks-sdk>=0.60,<1"
]

ai = [
  "openai>=1.100,<2",
  "anthropic>=0.100,<1"
]

api = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1"
]

all = [
  "sas-modernization-factory[dev,conversion,azure,databricks,ai,api]"
]

[project.scripts]
smf = "smf.cli.main:main"
smf-agent = "smf.engineering_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smf.schemas" = ["*.json"]
"smf.deployment.templates" = ["humana/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["smf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
