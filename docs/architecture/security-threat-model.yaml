threats:
  - id: prompt-injection
    title: Embedded source or recalled instructions acquire authority
    severity: critical
    flow_ids: [source-to-discovery, recall-to-context, discovery-to-ai]
    scenario: Untrusted text attempts to select tools endpoints credentials protected paths approval or promotion
    owner_id: ai-owner
    control_ids: [discovery-sanitization, bounded-ai-authority, protected-worktrees]
    evidence_requirements: [authority-negative-tests, protected-path-review, provider-policy-proof]
    residual_status: unresolved
    review_disposition: review_blocker
    blocked_operations: [ai_submission, ai_repair]
  - id: cross-client-retrieval
    title: Advice or evidence crosses client workload or attempt scope
    severity: critical
    flow_ids: [recall-to-context, evidence-to-approval]
    scenario: Stale or unrelated client knowledge is retrieved and treated as authoritative current evidence
    owner_id: evidence-owner
    control_ids: [canonical-identity, bounded-ai-authority, human-approval-binding]
    evidence_requirements: [cross-client-negative-test, provenance-envelope, conflict-and-rejection-test]
    residual_status: unresolved
    review_disposition: review_blocker
    blocked_operations: [estate_recall_authority, ai_submission, competition_acceptance]
  - id: forged-attestation
    title: Caller-authored assertions manufacture a successful state
    severity: critical
    flow_ids: [evidence-to-approval, validation-to-evidence]
    scenario: An optional pass boolean or unverified locator is accepted in place of attributable evidence
    owner_id: security-owner
    control_ids: [readiness-evidence, separated-claims, human-approval-binding]
    evidence_requirements: [signature-verification, exact-identity-binding, assertion-mutation-test]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [humana_parity_qualification, certification, production_promotion]
  - id: mutable-qualified-input
    title: Qualified source or policy bytes mutate before downstream use
    severity: high
    flow_ids: [source-to-discovery, generated-to-runtime, runtime-to-validation]
    scenario: Downstream processing uses bytes that differ from the immutable qualification snapshot
    owner_id: evidence-owner
    control_ids: [source-snapshot, readiness-evidence]
    evidence_requirements: [mutation-after-admission-test, source-and-policy-digest-reverification]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [protected_data_execution, humana_parity_qualification]
  - id: secret-persistence
    title: Credentials or protected canaries enter durable artifacts
    severity: critical
    flow_ids: [source-to-discovery, identity-to-runtime, validation-to-evidence]
    scenario: Sensitive material survives in evidence telemetry errors model context or an unsanitized digest
    owner_id: security-owner
    control_ids: [discovery-sanitization, secret-receipts]
    evidence_requirements: [multi-boundary-canary-tests, sanitized-error-test, no-plaintext-inspection]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [protected_data_ingestion, protected_data_execution, ai_submission]
  - id: boundary-escape
    title: References escape workload client environment or storage scope
    severity: high
    flow_ids: [discovery-to-evidence, validation-to-evidence, evidence-to-approval]
    scenario: Traversal absolute or cross-scope references hide dependencies outputs mappings or evidence
    owner_id: evidence-owner
    control_ids: [canonical-identity, source-snapshot, immutable-evidence-recovery]
    evidence_requirements: [traversal-negative-tests, closure-reconciliation, cross-attempt-test]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [humana_parity_qualification, certification]
  - id: ambiguous-subject
    title: Empty nonconvertible or duplicate source identity passes admission
    severity: high
    flow_ids: [source-to-discovery, generated-to-runtime]
    scenario: No meaningful SAS entry point or multiple case-ambiguous matches are treated as eligible
    owner_id: discovery-owner
    control_ids: [canonical-identity, source-snapshot]
    evidence_requirements: [empty-subject-test, nonconvertible-subject-test, duplicate-identity-test]
    residual_status: mitigated
    review_disposition: no_blocker
    blocked_operations: []
  - id: skipped-as-success
    title: Incomplete lifecycle states are counted as parity success
    severity: critical
    flow_ids: [validation-to-evidence, evidence-to-approval]
    scenario: Generated skipped blocked unexecuted or unvalidated work inflates competition success
    owner_id: validation-owner
    control_ids: [separated-claims, independent-validation]
    evidence_requirements: [lifecycle-mutation-tests, terminal-telemetry-reconstruction]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [humana_parity_qualification, competition_acceptance]
  - id: approval-replay
    title: Human approval is replayed across a different attempt
    severity: critical
    flow_ids: [evidence-to-approval, approval-to-evidence]
    scenario: A valid approval record authorizes unrelated source policy run attempt or decision identities
    owner_id: approval-owner
    control_ids: [human-approval-binding, readiness-evidence]
    evidence_requirements: [cross-attempt-replay-test, denial-versus-pending-test]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [competition_acceptance, production_promotion]
  - id: evidence-corruption
    title: Interrupted publication overwrites or strands canonical evidence
    severity: high
    flow_ids: [discovery-to-evidence, validation-to-evidence, approval-to-evidence]
    scenario: Retry changes decision identity or cannot recreate missing derived telemetry after interruption
    owner_id: evidence-owner
    control_ids: [immutable-evidence-recovery]
    evidence_requirements: [restart-test, immutable-conflict-test, derived-recovery-test]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [end_to_end_certification]
  - id: workload-state-corruption
    title: One workload failure mutates another workload evidence
    severity: high
    flow_ids: [discovery-to-evidence, worktree-to-evidence]
    scenario: Shared mutable paths or global serialization mix independent workload state and outcomes
    owner_id: engineering-owner
    control_ids: [canonical-identity, protected-worktrees, immutable-evidence-recovery]
    evidence_requirements: [two-workload-isolation-test, failure-isolation-test]
    residual_status: partially_mitigated
    review_disposition: review_blocker
    blocked_operations: [end_to_end_certification]
  - id: weak-validation
    title: Generated target or static checks substitute for independent parity evidence
    severity: critical
    flow_ids: [runtime-to-validation, validation-to-evidence]
    scenario: Generated artifacts mocks or source-derived expectations are treated as authoritative SAS parity
    owner_id: validation-owner
    control_ids: [independent-validation, separated-claims]
    evidence_requirements: [independent-baseline-proof, mutation-test, real-environment-evidence]
    residual_status: unresolved
    review_disposition: review_blocker
    blocked_operations: [humana_parity_qualification, certification]
  - id: unapproved-runtime
    title: Runtime or AI use proceeds without approved client bindings
    severity: critical
    flow_ids: [discovery-to-ai, identity-to-runtime, generated-to-runtime]
    scenario: Placeholder pending or unsupported endpoint policy identity or operating limits are bypassed
    owner_id: runtime-owner
    control_ids: [readiness-evidence, secret-receipts, bounded-ai-authority]
    evidence_requirements: [approved-binding-proof, malformed-enum-tests, fail-closed-preflight]
    residual_status: unresolved
    review_disposition: review_blocker
    blocked_operations: [ai_submission, protected_data_execution, production_promotion]

evidence_contract:
  required_identity_bindings: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
  claim_states: [generated, executed, validated, parity_passed, certified, human_approved, blocked, skipped, failed, pending, denied]
  meaningful_eligible_subject_required: true
  source_snapshot_or_reverification_required: true
  immutable_canonical_evidence: true
  idempotent_derived_recovery: true
  cross_workload_isolation: true
  secret_handling: sanitize_before_persistence_or_hashing

advisory_recall:
  authority: advisory_only
  required_provenance_fields: [origin, client_scope, applicability, version, selection_reason, conflicts, supersession, rejection_state]
  cross_client_default: excluded

