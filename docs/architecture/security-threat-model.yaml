owners:
  - {id: security-owner, role: SMF security owner}
  - {id: discovery-owner, role: SMF discovery owner}
  - {id: ai-owner, role: AIP-01 provider boundary owner}
  - {id: evidence-owner, role: SMF evidence and telemetry owner}
  - {id: runtime-owner, role: Humana runtime owner}
  - {id: validation-owner, role: Humana validation owner}
  - {id: approval-owner, role: Named Humana approval authority}
  - {id: engineering-owner, role: SMF engineering workflow owner}

data_classes:
  - public
  - internal
  - client_confidential
  - protected_data
  - credential_reference
  - sanitized_evidence
  - runtime_result
  - approval_record

boundaries:
  - id: untrusted-source
    kind: source_ingestion
    name: Untrusted repositories manifests scheduler metadata and embedded instructions
    accepted_data_classes: [public, client_confidential, protected_data]
    authority: untrusted_data
    implementation_state: partial
    blocked_operations: [protected_data_ingestion]
  - id: canonical-discovery
    kind: canonical_evidence
    name: Canonical workload discovery sanitization identity and lineage evidence
    accepted_data_classes: [sanitized_evidence, client_confidential]
    authority: governed_control
    implementation_state: implemented
    blocked_operations: []
  - id: advisory-recall
    kind: advisory_recall
    name: Advisory review learning and future estate recall
    accepted_data_classes: [sanitized_evidence, internal]
    authority: advisory_only
    implementation_state: partial
    blocked_operations: [estate_recall_authority]
  - id: ai-provider
    kind: ai_transport
    name: Bounded model context and approved provider transport
    accepted_data_classes: [sanitized_evidence, client_confidential]
    authority: untrusted_data
    implementation_state: target
    blocked_operations: [ai_submission, ai_repair]
  - id: evidence-store
    kind: durable_storage
    name: Append-only evidence and bounded telemetry storage
    accepted_data_classes: [sanitized_evidence, runtime_result, approval_record]
    authority: governed_control
    implementation_state: partial
    blocked_operations: [end_to_end_certification]
  - id: identity-secret-plane
    kind: identity_secrets
    name: Entra identity and Vault secret resolution boundary
    accepted_data_classes: [credential_reference, sanitized_evidence]
    authority: governed_control
    implementation_state: partial
    blocked_operations: [live_authentication, protected_data_execution]
  - id: execution-runtimes
    kind: runtime
    name: Independent SAS baseline and isolated Databricks target runtimes
    accepted_data_classes: [protected_data, runtime_result, credential_reference]
    authority: external_runtime
    implementation_state: unresolved
    blocked_operations: [baseline_execution, databricks_execution, parity_qualification]
  - id: parity-decision
    kind: validation
    name: Independent validation and parity decision boundary
    accepted_data_classes: [runtime_result, sanitized_evidence]
    authority: governed_control
    implementation_state: partial
    blocked_operations: [humana_parity_qualification, certification]
  - id: approval-promotion
    kind: human_approval
    name: Attempt-bound human approval and production promotion
    accepted_data_classes: [approval_record, sanitized_evidence]
    authority: human_authority
    implementation_state: partial
    blocked_operations: [competition_acceptance, production_promotion]
  - id: isolated-engineering
    kind: engineering_worktree
    name: Isolated worktrees protected paths deterministic gates and final integration
    accepted_data_classes: [internal, sanitized_evidence]
    authority: governed_control
    implementation_state: implemented
    blocked_operations: []

flows:
  - id: source-to-discovery
    origin_boundary_id: untrusted-source
    destination_boundary_id: canonical-discovery
    payload_classes: [client_confidential, protected_data]
    trust: untrusted
    sanitization: at_ingress
    immutable_input: snapshot
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: partial
    blocked_operations: [protected_data_ingestion]
    grants_authority: false
  - id: discovery-to-evidence
    origin_boundary_id: canonical-discovery
    destination_boundary_id: evidence-store
    payload_classes: [sanitized_evidence]
    trust: governed
    sanitization: before_persistence
    immutable_input: snapshot
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: implemented
    blocked_operations: []
    grants_authority: false
  - id: recall-to-context
    origin_boundary_id: advisory-recall
    destination_boundary_id: ai-provider
    payload_classes: [sanitized_evidence, internal]
    trust: advisory
    sanitization: before_persistence
    immutable_input: snapshot
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: target
    blocked_operations: [ai_submission, ai_repair]
    grants_authority: false
  - id: discovery-to-ai
    origin_boundary_id: canonical-discovery
    destination_boundary_id: ai-provider
    payload_classes: [sanitized_evidence, client_confidential]
    trust: governed
    sanitization: before_persistence
    immutable_input: snapshot
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: target
    blocked_operations: [ai_submission]
    grants_authority: false
  - id: identity-to-runtime
    origin_boundary_id: identity-secret-plane
    destination_boundary_id: execution-runtimes
    payload_classes: [credential_reference]
    trust: governed
    sanitization: not_applicable
    immutable_input: digest_reverification
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: partial
    blocked_operations: [live_authentication, protected_data_execution]
    grants_authority: false
  - id: generated-to-runtime
    origin_boundary_id: ai-provider
    destination_boundary_id: execution-runtimes
    payload_classes: [client_confidential, sanitized_evidence]
    trust: untrusted
    sanitization: before_persistence
    immutable_input: snapshot
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: target
    blocked_operations: [databricks_execution]
    grants_authority: false
  - id: runtime-to-validation
    origin_boundary_id: execution-runtimes
    destination_boundary_id: parity-decision
    payload_classes: [runtime_result]
    trust: external
    sanitization: before_persistence
    immutable_input: digest_reverification
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: unresolved
    blocked_operations: [humana_parity_qualification, certification]
    grants_authority: false
  - id: validation-to-evidence
    origin_boundary_id: parity-decision
    destination_boundary_id: evidence-store
    payload_classes: [sanitized_evidence, runtime_result]
    trust: governed
    sanitization: before_persistence
    immutable_input: digest_reverification
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: partial
    blocked_operations: [end_to_end_certification]
    grants_authority: false
  - id: evidence-to-approval
    origin_boundary_id: evidence-store
    destination_boundary_id: approval-promotion
    payload_classes: [sanitized_evidence, approval_record]
    trust: governed
    sanitization: not_applicable
    immutable_input: digest_reverification
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: partial
    blocked_operations: [competition_acceptance, production_promotion]
    grants_authority: false
  - id: approval-to-evidence
    origin_boundary_id: approval-promotion
    destination_boundary_id: evidence-store
    payload_classes: [approval_record]
    trust: human
    sanitization: before_persistence
    immutable_input: digest_reverification
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: partial
    blocked_operations: [production_promotion]
    grants_authority: false
  - id: worktree-to-evidence
    origin_boundary_id: isolated-engineering
    destination_boundary_id: evidence-store
    payload_classes: [internal, sanitized_evidence]
    trust: governed
    sanitization: before_persistence
    immutable_input: snapshot
    required_identity_fields: [client_id, deployment_id, environment_id, workload_id, subject_id, source_digest, policy_id, policy_version, provider_id, strategy_version, run_id, attempt_id, decision_id, artifact_id]
    implementation_state: implemented
    blocked_operations: []
    grants_authority: false

