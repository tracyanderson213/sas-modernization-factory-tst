  - {id: hc-req-02, owner_id: discovery-owner, blocks: [protected_data_ingestion, competition_acceptance], state: pending}
  - {id: hc-req-03, owner_id: runtime-owner, blocks: [baseline_execution, humana_parity_qualification], state: pending}
  - {id: hc-req-04, owner_id: validation-owner, blocks: [humana_parity_qualification, certification], state: pending}
  - {id: hc-req-05, owner_id: runtime-owner, blocks: [databricks_execution, protected_data_execution], state: pending}
  - {id: hc-req-06, owner_id: security-owner, blocks: [ai_submission, protected_data_execution], state: pending}
  - {id: hc-req-07, owner_id: runtime-owner, blocks: [databricks_execution, competition_acceptance], state: pending}
  - {id: hc-req-08, owner_id: ai-owner, blocks: [ai_repair, competition_acceptance], state: pending}
  - {id: hc-req-09, owner_id: approval-owner, blocks: [competition_acceptance, production_promotion], state: pending}
  - {id: hc-req-10, owner_id: security-owner, blocks: [live_authentication, protected_data_execution], state: pending}
  - {id: exact-runtime-bindings, owner_id: runtime-owner, blocks: [live_authentication, protected_data_execution], state: unresolved}
  - {id: approval-promotion-bindings, owner_id: approval-owner, blocks: [certification, production_promotion], state: unresolved}
